[tools]

[env]
_.file = ["config/overlays/dev/config.env", "config/overlays/dev/secret.env"]

[vars]
img = "maxicloud:latest"
local_img = "localhost:5001/maxicloud:latest"
kubectl = "kubectl"
kustomize = "./bin/kustomize"
controller_gen = "./bin/controller-gen"
namespace = "maxicloud-system"

[tasks.manifests]
description = "Generate CRD and RBAC manifests"
run = '{{vars.controller_gen}} rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases'

[tasks.generate]
description = "Generate DeepCopy method implementations"
run = '{{vars.controller_gen}} object:headerFile="hack/boilerplate.go.txt" paths="./..."'

[tasks."go:fmt"]
description = "Run go fmt"
run = "go fmt ./..."

[tasks."ts:fmt"]
description = "Run frontend formatter"
run = "pnpm -C dashboard run fix"

[tasks.fmt]
description = "Run all formatters"
run = [
  { task = "go:fmt" },
  { task = "ts:fmt" },
]

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks."go:lint"]
description = "Run golangci-lint"
run = "./bin/golangci-lint run"

[tasks."ts:lint"]
description = "Run frontend checks"
run = "pnpm -C dashboard run check"

[tasks.lint]
description = "Run all linters"
run = [
  { task = "go:lint" },
  { task = "ts:lint" },
]

[tasks.test]
description = "Run tests"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go test $(go list ./... | grep -v /e2e) -coverprofile cover.out"

[tasks.build]
description = "Build binary"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go build -o bin/manager ./cmd"

[tasks."buf:generate"]
description = "Generate proto files"
run = """
buf generate
go fmt ./gen/...
pnpm -C dashboard exec biome check --write app/gen
"""

[tasks."docker:build"]
description = "Build docker image"
run = "docker build -t {{vars.img}} ."

[tasks."docker:push"]
description = "Push docker image to local registry"
run = """
docker tag {{vars.img}} {{vars.local_img}}
docker push {{vars.local_img}}
"""

[tasks.deploy]
description = "Apply kustomize manifests to cluster"
depends = ["manifests"]
run = "{{vars.kustomize}} build config/overlays/dev | {{vars.kubectl}} apply -f -"

[tasks.undeploy]
description = "Remove kustomize manifests from cluster"
run = "{{vars.kustomize}} build config/overlays/dev | {{vars.kubectl}} delete --ignore-not-found=true -f -"

[tasks.rollout]
description = "Restart deployment"
run = "{{vars.kubectl}} rollout restart deployment maxicloud-controller-manager maxicloud-gateway -n {{vars.namespace}}"

[tasks.release]
description = "Full build and deploy"
run = [
  { task = "manifests" },
  { task = "generate" },
  { task = "buf:generate" },
  { task = "docker:build" },
  { task = "docker:push" },
  { task = "deploy" },
  { task = "rollout" },
]

[tasks."log:controller"]
description = "Tail controller logs"
run = "{{vars.kubectl}} logs -n {{vars.namespace}} deployment/maxicloud-controller-manager -f"

[tasks."log:gateway"]
description = "Tail gateway logs"
run = "{{vars.kubectl}} logs -n {{vars.namespace}} deployment/maxicloud-gateway -f"

[tasks."db:migrate"]
description = "Apply database migrations"
run = 'DATABASE_URL="postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@$POSTGRESQL_HOST:$POSTGRESQL_PORT/$POSTGRESQL_DB?sslmode=disable" dbmate -d db/migrations up'

[tasks."db:rollback"]
description = "Rollback last migration"
run = 'DATABASE_URL="postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@$POSTGRESQL_HOST:$POSTGRESQL_PORT/$POSTGRESQL_DB?sslmode=disable" dbmate -d db/migrations down'

[tasks."db:status"]
description = "Show migration status"
run = 'DATABASE_URL="postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@$POSTGRESQL_HOST:$POSTGRESQL_PORT/$POSTGRESQL_DB?sslmode=disable" dbmate -d db/migrations status'
