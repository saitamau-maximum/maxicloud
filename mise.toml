[settings]
env_shell_expand = false

[tools]
go = "1.25"
node = "24"
buf = "1.68"
dbmate = "2.32"
kubectl = "1.35"
golangci-lint = "2.8"
pnpm = "10"

[env]
_.file = ["config/overlays/dev/config.env", "config/overlays/dev/secret.env"]

[vars]
img = "maxicloud:latest"
local_img = "localhost:5001/maxicloud:latest"
kubectl = "kubectl"
kustomize = "./bin/kustomize"
controller_gen = "./bin/controller-gen"
namespace = "maxicloud-system"
envtest_k8s_version = "1.35"
db_url = "postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@localhost:$POSTGRESQL_PORT/$POSTGRESQL_DB?sslmode=disable"
db_forward = "kubectl port-forward -n {{vars.namespace}} svc/maxicloud-postgresql $POSTGRESQL_PORT:$POSTGRESQL_PORT &>/dev/null & PF_PID=$!; trap 'kill $PF_PID' EXIT; sleep 1"

[tasks.setup]
description = "開発環境をセットアップする"
run = [
  "mise install",
  "GOBIN=\"$(pwd)/bin\" go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1",
  "GOBIN=\"$(pwd)/bin\" go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1",
  "GOBIN=\"$(pwd)/bin\" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23",
  "hack/setup.sh",
  "kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml",
]

[tasks.manifests]
description = "CRD・RBACマニフェストを生成する"
run = '{{vars.controller_gen}} rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases'

[tasks.generate]
description = "DeepCopyメソッドを生成する"
run = '{{vars.controller_gen}} object:headerFile="hack/boilerplate.go.txt" paths="./..."'

[tasks."go:fmt"]
description = "go fmt を実行する"
run = "go fmt ./..."

[tasks."ts:fmt"]
description = "フロントエンドのフォーマッターを実行する"
run = "pnpm -C dashboard run fix"

[tasks.fmt]
description = "全フォーマッターを実行する"
run = [
  { task = "go:fmt" },
  { task = "ts:fmt" },
]

[tasks.vet]
description = "go vet を実行する"
run = "go vet ./..."

[tasks."go:lint-setup"]
description = "カスタムgolangci-lintをビルドする"
run = """
golangci-lint custom --destination bin --name golangci-lint-custom
mv bin/golangci-lint-custom bin/golangci-lint
"""

[tasks."go:lint"]
description = "golangci-lint を実行する"
run = "./bin/golangci-lint run"

[tasks."ts:lint"]
description = "フロントエンドの静的解析を実行する"
run = "pnpm -C dashboard run check"

[tasks.lint]
description = "全リンターを実行する"
run = [
  { task = "go:lint" },
  { task = "ts:lint" },
]

[tasks.test]
description = "テストを実行する"
depends = ["manifests", "generate", "fmt", "vet"]
run = 'KUBEBUILDER_ASSETS="$(./bin/setup-envtest use {{vars.envtest_k8s_version}} --bin-dir bin/k8s -p path)" go test $(go list ./... | grep -v /e2e) -coverprofile cover.out'

[tasks.build]
description = "バイナリをビルドする"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go build -o bin/manager ./cmd"

[tasks."buf:generate"]
description = "protoファイルからコードを生成する"
run = """
buf generate
go fmt ./gen/...
pnpm -C dashboard exec biome check --write app/gen
"""

[tasks."docker:build"]
description = "Dockerイメージをビルドする"
run = "docker build -t {{vars.img}} ."

[tasks."docker:push"]
description = "Dockerイメージをローカルレジストリにプッシュする"
run = """
docker tag {{vars.img}} {{vars.local_img}}
docker push {{vars.local_img}}
"""

[tasks.deploy]
description = "kustomizeマニフェストをクラスターに適用する"
depends = ["manifests"]
run = "{{vars.kustomize}} build config/overlays/dev | {{vars.kubectl}} apply -f -"

[tasks.undeploy]
description = "kustomizeマニフェストをクラスターから削除する"
run = "{{vars.kustomize}} build config/overlays/dev | {{vars.kubectl}} delete --ignore-not-found=true -f -"

[tasks.rollout]
description = "デプロイメントを再起動する"
run = [
  "{{vars.kubectl}} rollout restart deployment maxicloud-controller-manager maxicloud-gateway -n {{vars.namespace}}",
  "{{vars.kubectl}} rollout status deployment maxicloud-controller-manager -n {{vars.namespace}}",
  "{{vars.kubectl}} rollout status deployment maxicloud-gateway -n {{vars.namespace}}",
]

[tasks.release]
description = "ビルドからデプロイまで一括実行する"
run = [
  { task = "manifests" },
  { task = "generate" },
  { task = "buf:generate" },
  { task = "docker:build" },
  { task = "docker:push" },
  { task = "deploy" },
  { task = "rollout" },
]

[tasks."log:controller"]
description = "controllerのログをtailする"
run = "{{vars.kubectl}} logs -n {{vars.namespace}} deployment/maxicloud-controller-manager -f"

[tasks."log:gateway"]
description = "gatewayのログをtailする"
run = "{{vars.kubectl}} logs -n {{vars.namespace}} deployment/maxicloud-gateway -f"

[tasks."db:migrate"]
description = "マイグレーションを適用する"
run = '{{vars.db_forward}}; DATABASE_URL="{{vars.db_url}}" dbmate -d db/migrations up && pg_dump "{{vars.db_url}}" --schema-only --no-owner --no-acl --no-comments -f db/schema.sql'

[tasks."db:rollback"]
description = "直前のマイグレーションを戻す"
run = '{{vars.db_forward}}; DATABASE_URL="{{vars.db_url}}" dbmate -d db/migrations down'

[tasks."db:status"]
description = "マイグレーションの適用状況を確認する"
run = '{{vars.db_forward}}; DATABASE_URL="{{vars.db_url}}" dbmate -d db/migrations status'

[tasks."db:connect"]
description = "psqlセッションを開く"
run = '{{vars.db_forward}}; psql "{{vars.db_url}}"'

[tasks."db:dump"]
description = "スキーマをダンプする"
run = '{{vars.db_forward}}; pg_dump "{{vars.db_url}}" --schema-only --no-owner --no-acl --no-comments -f db/schema.sql'
